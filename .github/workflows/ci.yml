name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The command itself, on this repository: one file out, with buildings in it.
      - run: node dist/cli.js . -o out/self.html --no-browser
      - run: node -e "const s=require('fs').readFileSync('out/self.html','utf8'); if(!s.includes('src/cli.ts')) { console.error('the map does not contain this repository'); process.exit(1) }"
