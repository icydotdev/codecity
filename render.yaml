# codecity on the web (service/). One free instance and no autoscaling, so compute costs nothing.
# Bandwidth is the one thing billed by use ($0.15 a GB beyond the workspace's allowance, 5 GB on
# Hobby, shared by every service): the server stops serving maps once it has sent
# BANDWIDTH_GB_PER_MONTH.
#
# A free instance sleeps after 15 minutes without visitors, takes about a minute to wake, and loses
# its files when it sleeps: the drawn maps, and the count of bandwidth spent. To keep both and
# draw faster, use `plan: starter` and add this under the service:
#
#   disk:
#     name: data
#     mountPath: /var/data
#     sizeGB: 1
#
# with DATA_DIR set to /var/data.
services:
  - type: web
    name: codecity
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy only for changes that affect the service or the maps.
    buildFilter:
      paths:
        - src/**
        - service/**
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig*.json
    envVars:
      # A free instance has a fraction of a CPU, so it is given longer to clone and draw.
      - key: CLONE_SECONDS
        value: "240"
      - key: DRAW_SECONDS
        value: "240"
      - key: BANDWIDTH_GB_PER_MONTH
        value: "3"
      # Optional. Any GitHub token, with no permissions at all, lifts GitHub's limit on lookups
      # from 60 to 5,000 an hour.
      - key: GITHUB_TOKEN
        sync: false
